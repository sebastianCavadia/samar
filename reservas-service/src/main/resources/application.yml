server:
  port: 8083

spring:
  application:
    name: reservas-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/samar_reservas}
    username: ${DB_USER:reservas}
    password: ${DB_PASSWORD:reservas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

samar:
  servicios:
    cuentas: ${CUENTAS_URL:http://localhost:8081}
    oferta: ${OFERTA_URL:http://localhost:8082}
  reservas:
    expiracion-sin-pago-min: ${EXPIRACION_SIN_PAGO_MIN:15}   # RF056
    max-dias-apertura: 120
    zona-horaria: America/Bogota
    tarea-ms: ${TAREA_MS:60000}   # cada cuánto corren expiración (RF056) y completado (RF049)

management:
  endpoints:
    web:
      exposure:
        include: health

# RNF-034: OpenAPI de las rutas públicas (/internal queda fuera: solo es para otros servicios).
springdoc:
  paths-to-match: /api/**
  # El gateway publica esta documentación en /docs/reservas/: la página de Swagger debe pedir sus datos con ese prefijo.
  swagger-ui:
    config-url: /docs/reservas/v3/api-docs/swagger-config
    url: /docs/reservas/v3/api-docs
