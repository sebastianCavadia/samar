server:
  port: 8082

spring:
  application:
    name: oferta-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/samar_oferta}
    username: ${DB_USER:oferta}
    password: ${DB_PASSWORD:oferta}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB      # RF019: imágenes de la galería
      max-request-size: 3MB

samar:
  servicios:
    cuentas: ${CUENTAS_URL:http://localhost:8081}
  oferta:
    sincronizacion-ms: ${SINCRONIZACION_MS:60000}   # ADR-13: cada cuánto se consultan los prestadores suspendidos

management:
  endpoints:
    web:
      exposure:
        include: health

# RNF-034: OpenAPI de las rutas públicas (/internal queda fuera: solo es para otros servicios).
springdoc:
  paths-to-match: /api/**
  # El gateway publica esta documentación en /docs/oferta/: la página de Swagger debe pedir sus datos con ese prefijo.
  swagger-ui:
    config-url: /docs/oferta/v3/api-docs/swagger-config
    url: /docs/oferta/v3/api-docs
