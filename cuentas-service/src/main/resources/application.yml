server:
  port: 8081

spring:
  application:
    name: cuentas-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/samar_cuentas}
    username: ${DB_USER:cuentas}
    password: ${DB_PASSWORD:cuentas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB      # RF008: foto de perfil
      max-request-size: 3MB

samar:
  cuentas:
    jwt-secret: ${JWT_SECRET:cambia-este-secreto-de-desarrollo-de-32-bytes-o-mas}
    jwt-expiracion-min: 60
    max-intentos-fallidos: 5   # RF005
    bloqueo-min: 5             # RF005
    admin-correo: ${ADMIN_CORREO:admin@samar.co}
    admin-password: ${ADMIN_PASSWORD:Admin12345}

management:
  endpoints:
    web:
      exposure:
        include: health

# RNF-034: OpenAPI de las rutas públicas (/internal queda fuera: solo es para otros servicios).
springdoc:
  paths-to-match: /api/**
  # El gateway publica esta documentación en /docs/cuentas/: la página de Swagger debe pedir sus datos con ese prefijo.
  swagger-ui:
    config-url: /docs/cuentas/v3/api-docs/swagger-config
    url: /docs/cuentas/v3/api-docs
